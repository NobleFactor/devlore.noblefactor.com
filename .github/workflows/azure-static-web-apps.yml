name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "name=" >> $GITHUB_OUTPUT
            echo "hostname=devlore.noblefactor.com" >> $GITHUB_OUTPUT
            echo "install_url=https://devlore.noblefactor.com/install.sh" >> $GITHUB_OUTPUT
          else
            # Convert branch name to valid environment name (e.g., release/1.0 -> release-1-0)
            ENV_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g')
            echo "name=$ENV_NAME" >> $GITHUB_OUTPUT
            echo "hostname=${ENV_NAME}.devlore.noblefactor.com" >> $GITHUB_OUTPUT
            # Use Azure SWA environment URL for non-production
            echo "install_url=https://delightful-grass-0ac0a4c1e-${ENV_NAME}.westus2.6.azurestaticapps.net/install.sh" >> $GITHUB_OUTPUT
          fi

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_INSTALL_URL: ${{ steps.env.outputs.install_url }}

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/dist"
          skip_app_build: true
          production_branch: "main"
          deployment_environment: ${{ steps.env.outputs.name }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure custom domain
        run: |
          az staticwebapp hostname set \
            --name devlore-noblefactor-com \
            --hostname ${{ steps.env.outputs.hostname }} \
            --no-wait || true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
