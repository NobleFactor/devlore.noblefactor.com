name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  # Azure Static Web Apps staging-environment cap (Standard tier). Detection compares the
  # live environment count against this before any PR deploy.
  STAGING_LIMIT: 10

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "name=" >> $GITHUB_OUTPUT
            echo "hostname=devlore.noblefactor.com" >> $GITHUB_OUTPUT
            echo "install_url=https://devlore.noblefactor.com/install.sh" >> $GITHUB_OUTPUT
          else
            # Convert branch name to valid environment name (e.g., release/1.0 -> release-1-0)
            ENV_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g')
            echo "name=$ENV_NAME" >> $GITHUB_OUTPUT
            echo "hostname=${ENV_NAME}.devlore.noblefactor.com" >> $GITHUB_OUTPUT
            # Use Azure SWA environment URL for non-production
            echo "install_url=https://delightful-grass-0ac0a4c1e-${ENV_NAME}.westus2.6.azurestaticapps.net/install.sh" >> $GITHUB_OUTPUT
          fi

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_INSTALL_URL: ${{ steps.env.outputs.install_url }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check staging environment quota
        id: quota
        if: github.event_name == 'pull_request'
        run: |
          # Staging environments are every environment except production ("default"). Branch
          # environments (develop, release-*) count toward the quota but are never evicted.
          # The list shape varies by az version (properties flattened or nested), so both are read.
          staging=$(az staticwebapp environment list \
            --name devlore-noblefactor-com --output json \
            | jq '[ .[] | {name: .name, created: (.createdTimeUtc // .properties.createdTimeUtc)}
                    | select(.name != "default") ]')
          count=$(echo "$staging" | jq 'length')
          present=$(echo "$staging" | jq --arg n "${{ steps.env.outputs.name }}" 'any(.[]; .name == $n)')
          at_limit=$([ "$count" -ge "$STAGING_LIMIT" ] && echo true || echo false)
          echo "staging environments: $count (limit: $STAGING_LIMIT, at_limit: $at_limit, this PR's environment present: $present)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "at_limit=$at_limit" >> "$GITHUB_OUTPUT"
          echo "present=$present" >> "$GITHUB_OUTPUT"

      - name: Evict the oldest merge staging environment
        if: >-
          github.event_name == 'pull_request' &&
          steps.quota.outputs.at_limit == 'true' &&
          steps.quota.outputs.present == 'false'
        run: |
          # Eviction policy (approved 2026-07-27): only PR "*-merge" environments are ever evicted,
          # oldest first; branch environments (develop, release-*) are never touched. An evicted
          # PR that is still open recreates its environment on its next synchronize event.
          victim=$(az staticwebapp environment list \
            --name devlore-noblefactor-com --output json \
            | jq -r '[ .[] | {name: .name, created: (.createdTimeUtc // .properties.createdTimeUtc)}
                       | select(.name | endswith("-merge")) ]
                     | sort_by(.created) | first | .name // empty')
          if [ -z "$victim" ]; then
            echo "at limit but no *-merge environment exists to evict; the deploy below may be rejected"
            exit 0
          fi
          echo "evicting staging environment: $victim"
          az staticwebapp environment delete \
            --name devlore-noblefactor-com \
            --environment-name "$victim" \
            --yes

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/dist"
          skip_app_build: true
          production_branch: "main"
          deployment_environment: ${{ steps.env.outputs.name }}

      - name: Configure custom domain
        run: |
          az staticwebapp hostname set \
            --name devlore-noblefactor-com \
            --hostname ${{ steps.env.outputs.hostname }} \
            --no-wait || true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"

  quality-gate:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build_and_deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build and deploy succeeded"
