name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  # Azure Static Web Apps staging-environment cap (Standard tier). Detection compares the
  # live environment count against this before any PR deploy.
  STAGING_LIMIT: 10

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "name=" >> $GITHUB_OUTPUT
            echo "hostname=devlore.noblefactor.com" >> $GITHUB_OUTPUT
            echo "install_url=https://devlore.noblefactor.com/install.sh" >> $GITHUB_OUTPUT
          else
            # Convert branch name to valid environment name (e.g., release/1.0 -> release-1-0)
            ENV_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9]/-/g')
            echo "name=$ENV_NAME" >> $GITHUB_OUTPUT
            echo "hostname=${ENV_NAME}.devlore.noblefactor.com" >> $GITHUB_OUTPUT
            # Use Azure SWA environment URL for non-production
            echo "install_url=https://delightful-grass-0ac0a4c1e-${ENV_NAME}.westus2.6.azurestaticapps.net/install.sh" >> $GITHUB_OUTPUT
          fi

      - name: Build Astro site
        run: npm run build
        env:
          PUBLIC_INSTALL_URL: ${{ steps.env.outputs.install_url }}

      - name: Login to Azure
        id: azure-login
        continue-on-error: true
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Wait before Azure login retry
        if: steps.azure-login.outcome == 'failure'
        run: sleep 30

      - name: Retry Azure login
        id: azure-login-retry
        if: steps.azure-login.outcome == 'failure'
        continue-on-error: true
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Report Azure session
        id: azure
        run: |
          # A transient management-plane failure must not kill a deploy that runs on the
          # deployment token (2026-07-28: one develop deploy died on "No subscriptions
          # found" with the service principal, its secret, and its role assignment all
          # verified healthy; the next deploy succeeded untouched). One retry covers a
          # short blip; on a longer outage the az-dependent steps below are skipped and
          # the deploy proceeds — at the staging limit it then fails with Azure's own
          # quota message, which is exactly the pre-eviction behavior.
          if [ "${{ steps.azure-login.outcome }}" = "success" ] || [ "${{ steps.azure-login-retry.outcome }}" = "success" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Azure session available"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure login failed twice; quota detection, eviction, and custom-domain configuration are skipped for this run"
          fi

      - name: Check staging environment quota
        id: quota
        if: github.event_name == 'pull_request' && steps.azure.outputs.available == 'true'
        run: |
          # Staging environments are every environment except production ("default"). Branch
          # environments (develop, release-*) count toward the quota but are never evicted.
          # The list shape varies by az version (properties flattened or nested), so both are read.
          staging=$(az staticwebapp environment list \
            --name devlore-noblefactor-com --output json \
            | jq '[ .[] | {name: .name, created: (.createdTimeUtc // .properties.createdTimeUtc)}
                    | select(.name != "default") ]')
          count=$(echo "$staging" | jq 'length')
          present=$(echo "$staging" | jq --arg n "${{ steps.env.outputs.name }}" 'any(.[]; .name == $n)')
          at_limit=$([ "$count" -ge "$STAGING_LIMIT" ] && echo true || echo false)
          echo "staging environment inventory:"
          echo "$staging" | jq -r '.[] | "  \(.name)  (created \(.created))"'
          echo "staging environments: $count (limit: $STAGING_LIMIT, at_limit: $at_limit, this PR's environment present: $present)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "at_limit=$at_limit" >> "$GITHUB_OUTPUT"
          echo "present=$present" >> "$GITHUB_OUTPUT"

      - name: Evict the oldest merge staging environment
        if: >-
          github.event_name == 'pull_request' &&
          steps.quota.outputs.at_limit == 'true' &&
          steps.quota.outputs.present == 'false'
        run: |
          # Eviction policy (approved 2026-07-27, predicate corrected after the live run showed SWA
          # names PR environments by its own convention, not the deployment_environment input): only
          # PR environments are ever evicted, oldest first — production ("default") and branch
          # environments (develop, release-*) are never touched. An evicted PR that is still open
          # recreates its environment on its next synchronize event.
          victim=$(az staticwebapp environment list \
            --name devlore-noblefactor-com --output json \
            | jq -r '[ .[] | {name: .name, created: (.createdTimeUtc // .properties.createdTimeUtc)}
                       | select(.name != "default" and .name != "develop"
                                and (.name | startswith("release-") | not)) ]
                     | sort_by(.created) | first | .name // empty')
          if [ -z "$victim" ]; then
            echo "at limit but only protected environments exist; the deploy below may be rejected"
            exit 0
          fi
          echo "evicting staging environment: $victim"
          # The service principal can issue the delete but lacks staticSitesOperationStatuses/read,
          # so az's poll of the async operation fails after the delete is accepted. Tolerate that
          # and confirm by ground truth: re-list until the victim disappears.
          az staticwebapp environment delete \
            --name devlore-noblefactor-com \
            --environment-name "$victim" \
            --yes || echo "delete returned non-zero (operation-status poll); confirming via list"
          gone=false
          for _ in $(seq 1 12); do
            sleep 5
            gone=$(az staticwebapp environment list \
              --name devlore-noblefactor-com --output json \
              | jq --arg v "$victim" 'any(.[]; .name == $v) | not')
            [ "$gone" = "true" ] && break
          done
          if [ "$gone" != "true" ]; then
            echo "environment $victim still present after 60s; the deploy below may be rejected"
            exit 1
          fi
          echo "environment $victim evicted"

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/dist"
          skip_app_build: true
          production_branch: "main"
          deployment_environment: ${{ steps.env.outputs.name }}

      - name: Configure custom domain
        if: steps.azure.outputs.available == 'true'
        run: |
          az staticwebapp hostname set \
            --name devlore-noblefactor-com \
            --hostname ${{ steps.env.outputs.hostname }} \
            --no-wait || true

      # The steps a job that deploys a static site to Azure ends with (noblefactor-engprod#613). When the job fails, or
      # its Azure sign-in does, the azure/login step with the id azure-login, which a job may carry on past, as the
      # site's deploy does, they check the site's Azure credentials at once: a bad one raises its alert, naming the
      # workflow and its run; ones that check fine raise nothing, the failure being the job's own or a moment's. The
      # App's secrets are for setting a duplicate alert's Resolution. The check is fetched into a folder of its own,
      # leaving the job's working tree as it is. The job's own token needs issues: write and contents: read. They run
      # only where the run can read the repository's secrets: never for Dependabot, on any event, and never on a pull
      # request from a fork, whose runs get none, so that such a failure raises no false alert. They are
      # noblefactor-engprod's workflow-templates/credentials-check.azure-failure-steps.yml, as landed by
      # NobleFactor/noblefactor-engprod#613's plan § 5.15.
      - uses: actions/checkout@v4
        if: >-
          (failure() || steps.azure-login.outcome == 'failure') && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sparse-checkout: .github/credentials-check
          path: .credentials-check
      - name: Report a failure the Azure credentials may have caused
        if: >-
          (failure() || steps.azure-login.outcome == 'failure') && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CHECKS: azure
          AZURE_STATIC_SITE: ${{ vars.AZURE_STATIC_SITE }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CREDENTIALS_EXPIRES: ${{ vars.AZURE_CREDENTIALS_EXPIRES }}
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          MODE: report
          KIND: organization
          ACCOUNT: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .credentials-check/.github/credentials-check/credentials-check.sh || true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"

      # The steps a job that deploys a static site to Azure ends with (noblefactor-engprod#613). When the job fails, or
      # its Azure sign-in does, the azure/login step with the id azure-login, which a job may carry on past, as the
      # site's deploy does, they check the site's Azure credentials at once: a bad one raises its alert, naming the
      # workflow and its run; ones that check fine raise nothing, the failure being the job's own or a moment's. The
      # App's secrets are for setting a duplicate alert's Resolution. The check is fetched into a folder of its own,
      # leaving the job's working tree as it is. The job's own token needs issues: write and contents: read. They run
      # only where the run can read the repository's secrets: never for Dependabot, on any event, and never on a pull
      # request from a fork, whose runs get none, so that such a failure raises no false alert. They are
      # noblefactor-engprod's workflow-templates/credentials-check.azure-failure-steps.yml, as landed by
      # NobleFactor/noblefactor-engprod#613's plan § 5.15.
      - uses: actions/checkout@v4
        if: >-
          (failure() || steps.azure-login.outcome == 'failure') && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sparse-checkout: .github/credentials-check
          path: .credentials-check
      - name: Report a failure the Azure credentials may have caused
        if: >-
          (failure() || steps.azure-login.outcome == 'failure') && github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CHECKS: azure
          AZURE_STATIC_SITE: ${{ vars.AZURE_STATIC_SITE }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CREDENTIALS_EXPIRES: ${{ vars.AZURE_CREDENTIALS_EXPIRES }}
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          MODE: report
          KIND: organization
          ACCOUNT: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .credentials-check/.github/credentials-check/credentials-check.sh || true

  quality-gate:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build_and_deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build and deploy succeeded"
